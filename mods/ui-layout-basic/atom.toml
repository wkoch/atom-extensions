manifest = 1
name = "atom/layout-basic"
version = "0.8.0"
kind = "ui-mod"
description = "Layout mínimo: renderer de ui.root e ui.views (regiões + mount de pontos)"
license = "MIT"
engine = ">=0.1.0"

[contributes.renderers]
"ui.root" = { module = "assets/layout.js" }
"ui.views" = { module = "assets/layout.js" }
"ui.status.items" = { module = "assets/layout.js" }
