manifest = 1
name = "atom/code-starter"
version = "0.9.0"
kind = "distribution"
description = "Perfil para programar com o Atom: chat + ferramentas de arquivo/shell (com confirmação) sobre OpenAI-compatíveis"
license = "MIT"
engine = ">=0.1.0, <2.0.0"

[contributes.distribution]
packages = { "atom/ui-cli" = "^0.2", "atom/agent-loop-basic" = "^0.2", "atom/tools-fs" = "^0.2", "atom/tools-shell" = "^0.2", "atom/llm-openai-compat" = "^0.2", "atom/guard-shell" = "^0.3" }
bindings = { "ai.agent@0" = "atom/agent-loop-basic", "ai.llm@0" = "atom/llm-openai-compat" }
