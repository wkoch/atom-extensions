# Release por pacote (ADR-E005). Tag: <dir>@<versão>, ex.: tools-fs@0.2.1
# Secrets:
#   ATOM_PUBLISHER_KEY  seed ed25519 do publisher "atom"
#   ATOM_STORE_TOKEN    token p/ abrir PR no atom-store
# Vars:
#   ATOM_STORE_REPO     ex.: org/atom-store
#   ATOM_VERSION        release do CLI atom usado p/ pack
name: release
on:
  push:
    tags: ["*@*"]

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.m.outputs.dir }}
      rust: ${{ steps.m.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          name="${GITHUB_REF_NAME%@*}"
          ver="${GITHUB_REF_NAME#*@}"
          dir=""
          for d in extensions mods contracts distributions; do
            [ -d "$d/$name" ] && dir="$d/$name"
          done
          [ "$name" = "kit" ] && dir="kit"
          [ -n "$dir" ] || { echo "pacote $name não encontrado"; exit 1; }
          grep -q "^version = \"$ver\"" "$dir/atom.toml" \
            || { echo "tag $ver != atom.toml"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if [ -f "$dir/Cargo.toml" ]; then rust=true; else rust=false; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    if: needs.meta.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-amd64
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
            zig: true
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.zig
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - shell: bash
        env:
          DIR: ${{ needs.meta.outputs.dir }}
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          pkg=$(python3 -c "import tomllib,os;print(tomllib.load(
            open(os.environ['DIR']+'/Cargo.toml','rb'))['package']['name'])")
          build=build
          [ "$ZIG" = "true" ] && build=zigbuild
          cargo "$build" --release -p "$pkg" --target "$TARGET"
          mkdir -p stage/bin
          ep=$(python3 -c "import tomllib,os;print(tomllib.load(
            open(os.environ['DIR']+'/atom.toml','rb')).get('entrypoint',''))")
          [ -n "$ep" ] || { echo "atom.toml sem entrypoint"; exit 1; }
          bin=$(python3 -c "import tomllib,os
          d=tomllib.load(open(os.environ['DIR']+'/Cargo.toml','rb'))
          print(d['bin'][0]['name'] if 'bin' in d else d['package']['name'].split('-',1)[1])")
          exe="target/$TARGET/release/$bin"
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          cp "$exe" "stage/$ep"
          chmod +x "stage/$ep" || true
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.platform }}
          path: stage

  publish:
    needs: [meta, build]
    if: >-
      always() && needs.meta.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # cria a Release neste repo (GITHUB_TOKEN)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: staged
      - name: pack + release + PR na loja
        env:
          ATOM_PUBLISHER_KEY: ${{ secrets.ATOM_PUBLISHER_KEY }}
          STORE_TOKEN: ${{ secrets.ATOM_STORE_TOKEN }}
          ATOM_STORE_REPO: ${{ vars.ATOM_STORE_REPO }}
          ATOM_VERSION: ${{ vars.ATOM_VERSION }}
        run: |
          # CLI do core (v1.x) p/ `ext pack`/`ext publish` (job roda em ubuntu-latest).
          rm -rf /tmp/atom-cli && mkdir -p /tmp/atom-cli
          gh release download "v${ATOM_VERSION}" -R "wkoch/atom" \
            -p "atom-v${ATOM_VERSION}-linux-amd64.tar.gz" -D /tmp/atom-cli \
            && tar -xzf /tmp/atom-cli/atom-v${ATOM_VERSION}-linux-amd64.tar.gz \
              -C /tmp/atom-cli --strip-components=1 \
            || cargo install --git https://github.com/wkoch/atom --tag "v${ATOM_VERSION}" --locked atom
          export PATH="$HOME/.cargo/bin:/tmp/atom-cli:$PATH"
          atom --version || { echo "atom CLI indisponível"; exit 1; }
          name="${GITHUB_REF_NAME%@*}"
          ver="${GITHUB_REF_NAME#*@}"
          mkdir -p out
          # `--key` espera arquivo (0600); o secret é a seed `ed25519-seed:BASE64`.
          umask 077
          printf '%s' "$ATOM_PUBLISHER_KEY" > /tmp/publisher.key
          for plat in linux-amd64 linux-arm64 darwin-arm64 darwin-amd64 windows-amd64; do
            [ -d "staged/pkg-$plat" ] || continue
            atom ext pack "$dir" --platform "$plat" --key /tmp/publisher.key --out-dir out/
          done
          rm -f /tmp/publisher.key
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" out/*.tar.gz
          # PR na loja (v1; v2 quando o core tiver a ferramenta pub v2 — E0.1):
          # `atom ext publish --store-dir` mescla `out/*.index.json` sem a chave da loja.
          git clone "https://x-access-token:${STORE_TOKEN}@github.com/${ATOM_STORE_REPO}.git" /tmp/atom-store
          atom ext publish --store-dir /tmp/atom-store/v1 --package "$name" --version "$ver" out/*.index.json
          (cd /tmp/atom-store && git checkout -b "pkg/${GITHUB_REF_NAME}" \
            && git add v1 && git commit -m "publish ${GITHUB_REF_NAME}" && git push -u origin HEAD)
          GH_TOKEN="$STORE_TOKEN" gh pr create -R "$ATOM_STORE_REPO" --head "pkg/${GITHUB_REF_NAME}" \
            --title "publish ${GITHUB_REF_NAME}" --body "Publicação de ${GITHUB_REF_NAME} (release.yml)."
