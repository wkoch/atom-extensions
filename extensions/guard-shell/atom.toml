manifest = 1
name = "atom/guard-shell"
version = "0.3.0"
kind = "extension"
description = "Guardião de shell (v0.3): intercepta ai.tools@0/execute e confirma via ui.prompt@0"
license = "MIT"
engine = ">=0.1.0"
protocol = "atom/1"
entrypoint = "bin/guard-shell"
activation = ["onService:ai.tools@0"]
capabilities = ["service:ui.prompt@0", "intercept:ai.tools@0"]

[[intercepts]]
match = "ai.tools@0/execute"
phase = "before"
priority = 50
